<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTH-01 | Waypoint Dispatch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #080d1a; 
            color: #f8fafc; 
            font-family: monospace; 
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #111d38;
            border: 1px solid #1e293b;
            width: 320px;
            padding: 24px;
        }
        .header {
            margin-bottom: 24px;
            font-weight: bold;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 8px;
            background-color: #080d1a;
            border: 1px solid #334155;
            color: #f8fafc;
            font-family: monospace;
            font-size: 14px;
        }
        input:focus {
            outline: 2px solid #0ea5e9;
            outline-offset: -1px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active {
            background-color: #0284c7;
        }
        .debug-links {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #1e293b;
        }
        .debug-links div {
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .debug-links a {
            display: block;
            color: #0ea5e9;
            text-decoration: none;
            margin-bottom: 8px;
        }
        .debug-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            WAYPOINT AUTH-01
        </div>
        
        <form onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="uid">ID:</label>
                <input type="text" id="uid" required>
            </div>
            
            <div class="form-group">
                <label for="pwd">PWD:</label>
                <input type="password" id="pwd" required>
            </div>
            
            <button type="submit">LOGIN</button>
        </form>

        <div class="debug-links">
            <div>TEST PROFILES:</div>
            <a href="#">STORE (PRIYA)</a>
            <a href="#">DISPATCH (KAMAL)</a>
            <a href="#">LOADER (NUWAN)</a>
            <a href="#">DRIVER (SAMAN)</a>
        </div>
    </div>
</body>
</html>

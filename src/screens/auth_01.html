<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waypoint Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#14b8a6', // muted teal
            'brand-hover': '#0d9488',
            surface: '#1e293b', // slate-800
            canvas: '#0f172a', // slate-900 (Midnight Oceanic)
            border: '#334155', // slate-700
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .fatigue-btn { min-height: 56px; }
        .interactive { transition: all 0.15s ease-out; cursor: pointer; }
        .interactive:active { transform: scale(0.98); }
        .input-ring:focus-within { outline: none; box-shadow: 0 0 0 2px #14b8a6; border-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-6 antialiased selection:bg-brand selection:text-white">

    <!-- Atmospheric Background Geometry -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-20">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-brand blur-[120px]"></div>
        <div class="absolute bottom-[10%] right-[5%] w-[30%] h-[40%] rounded-full bg-blue-600 blur-[150px]"></div>
    </div>

    <!-- Main Auth Surface -->
    <main class="z-10 w-full max-w-sm glass-panel rounded-xl overflow-hidden flex flex-col">
        
        <header class="p-6 border-b border-white/10 flex items-center gap-4 bg-surface/50">
            <div class="w-10 h-10 bg-brand/10 border border-brand/20 rounded-lg flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-brand text-xl">account_tree</span>
            </div>
            <div>
                <h1 class="text-lg font-semibold tracking-tight text-white leading-tight">Waypoint Dispatch</h1>
                <div class="text-[11px] font-mono text-brand tracking-widest uppercase mt-0.5">Secure Gateway</div>
            </div>
        </header>

        <section class="p-6 lg:p-8 space-y-6 bg-surface/30">
            <form class="space-y-5" onsubmit="event.preventDefault();">
                <div class="space-y-1.5">
                    <label for="operatorId" class="block text-[11px] font-mono font-medium tracking-widest text-slate-400 uppercase">Operator ID</label>
                    <div class="relative input-ring rounded-lg border border-border bg-canvas/80 overflow-hidden group">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-500 group-focus-within:text-brand transition-colors">person</span>
                        <input id="operatorId" type="text" placeholder="e.g. kamal.g" class="w-full bg-transparent pl-10 pr-4 py-3 text-white font-mono text-sm placeholder-slate-600 focus:outline-none" aria-required="true">
                    </div>
                </div>
                
                <div class="space-y-1.5">
                    <label for="passphrase" class="block text-[11px] font-mono font-medium tracking-widest text-slate-400 uppercase">Passphrase</label>
                    <div class="relative input-ring rounded-lg border border-border bg-canvas/80 overflow-hidden group">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-500 group-focus-within:text-brand transition-colors">key</span>
                        <input id="passphrase" type="password" placeholder="••••••••" class="w-full bg-transparent pl-10 pr-4 py-3 text-white font-mono text-sm placeholder-slate-600 focus:outline-none" aria-required="true">
                    </div>
                </div>
                
                <button type="submit" class="w-full interactive fatigue-btn bg-brand hover:bg-brand-hover text-white font-medium rounded-lg mt-8 flex items-center justify-center gap-2 focus:ring-2 focus:ring-offset-2 focus:ring-offset-canvas focus:ring-brand focus:outline-none shadow-lg shadow-brand/20">
                    <span class="material-symbols-outlined text-lg">login</span>
                    Authenticate
                </button>
            </form>
        </section>

        <!-- Judge/Testing Quick Launch -->
        <footer class="p-5 border-t border-white/5 bg-canvas/40">
            <div class="text-[10px] font-mono text-slate-500 tracking-widest uppercase mb-3 text-center">Test Profiles</div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" class="interactive flex items-center justify-center gap-2 p-2 rounded-md border border-white/10 bg-white/5 hover:bg-white/10 hover:border-white/20 focus:ring-1 focus:ring-brand focus:outline-none transition-colors text-xs text-slate-300">
                    <span class="material-symbols-outlined text-[14px]">storefront</span>
                    <span>Store Mgr</span>
                </button>
                <button type="button" class="interactive flex items-center justify-center gap-2 p-2 rounded-md border border-white/10 bg-white/5 hover:bg-white/10 hover:border-white/20 focus:ring-1 focus:ring-brand focus:outline-none transition-colors text-xs text-slate-300">
                    <span class="material-symbols-outlined text-[14px]">monitor_heart</span>
                    <span>Dispatch</span>
                </button>
                <button type="button" class="interactive flex items-center justify-center gap-2 p-2 rounded-md border border-white/10 bg-white/5 hover:bg-white/10 hover:border-white/20 focus:ring-1 focus:ring-brand focus:outline-none transition-colors text-xs text-slate-300">
                    <span class="material-symbols-outlined text-[14px]">warehouse</span>
                    <span>Loader</span>
                </button>
                <button type="button" class="interactive flex items-center justify-center gap-2 p-2 rounded-md border border-white/10 bg-white/5 hover:bg-white/10 hover:border-white/20 focus:ring-1 focus:ring-brand focus:outline-none transition-colors text-xs text-slate-300">
                    <span class="material-symbols-outlined text-[14px]">local_shipping</span>
                    <span>Driver</span>
                </button>
            </div>
        </footer>
        
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waypoint Dispatch — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: var(--md-sys-shape-corner-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-name {
      font: var(--md-sys-typescale-title-large);
      color: var(--md-sys-color-on-surface);
    }

    .sign-in-title {
      font: var(--md-sys-typescale-headline-large);
      color: var(--md-sys-color-on-surface);
      margin-bottom: 32px;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }

    .sign-in-btn {
      width: 100%;
      height: 48px;
    }

    .divider-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 32px 0;
      color: var(--md-sys-color-on-surface-variant);
      font: var(--md-sys-typescale-body-small);
    }
    .divider-row hr {
      flex: 1;
    }

    .judge-section-label {
      font: var(--md-sys-typescale-label-medium);
      color: var(--md-sys-color-on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .persona-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .persona-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-md);
      cursor: pointer;
      text-align: left;
      transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }
    .persona-btn:hover {
      background: var(--md-sys-color-surface-container);
      border-color: var(--md-sys-color-primary);
    }
    .persona-btn:active { transform: scale(0.98); }
    .persona-btn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    .persona-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--md-sys-shape-corner-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .persona-icon.store { background: #E3F2FD; color: #1565C0; }
    .persona-icon.dispatch { background: #E8F5E9; color: #2E7D32; }
    .persona-icon.loader { background: #FFF3E0; color: #E65100; }
    .persona-icon.driver { background: #F3E5F5; color: #6A1B9A; }

    .persona-info { min-width: 0; }
    .persona-role {
      font: var(--md-sys-typescale-label-large);
      color: var(--md-sys-color-on-surface);
    }
    .persona-id {
      font: var(--md-sys-typescale-body-small);
      color: var(--md-sys-color-on-surface-variant);
    }

    .scenario-bar {
      margin-top: 32px;
      padding: 12px 16px;
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-sm);
      font: var(--md-sys-typescale-body-small);
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
    }

    @media (max-width: 480px) {
      .persona-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="auth-container" role="main">

    <div class="brand-header">
      <div class="brand-icon">
        <span class="material-symbols-outlined">local_shipping</span>
      </div>
      <span class="brand-name">Waypoint Dispatch</span>
    </div>

    <h1 class="sign-in-title">Sign in</h1>

    <form onsubmit="event.preventDefault();" aria-label="Sign in form">
      <div class="form-fields">
        <div class="md-outlined-text-field">
          <input id="staff-id" type="text" placeholder=" " required aria-required="true">
          <label for="staff-id">Staff ID</label>
        </div>
        <div class="md-outlined-text-field">
          <input id="password" type="password" placeholder=" " required aria-required="true">
          <label for="password">Password</label>
        </div>
      </div>
      <button type="submit" class="md-filled-button sign-in-btn" onclick="location.href='disp_01.html'">Sign in</button>
    </form>

    <div class="divider-row">
      <hr class="md-divider">
      <span>or sign in as</span>
      <hr class="md-divider">
    </div>

    <div class="judge-section-label">Quick launch</div>
    <div class="persona-grid">
      <button type="button" class="persona-btn" aria-label="Sign in as Store Manager Priya" onclick="location.href='store_01.html'">
        <div class="persona-icon store">
          <span class="material-symbols-outlined">storefront</span>
        </div>
        <div class="persona-info">
          <div class="persona-role">Store Mgr</div>
          <div class="persona-id">Priya · OUT-007</div>
        </div>
      </button>

      <button type="button" class="persona-btn" aria-label="Sign in as Dispatcher Kamal" onclick="location.href='disp_01.html'">
        <div class="persona-icon dispatch">
          <span class="material-symbols-outlined">monitoring</span>
        </div>
        <div class="persona-info">
          <div class="persona-role">Dispatcher</div>
          <div class="persona-id">Kamal · Peliy.</div>
        </div>
      </button>

      <button type="button" class="persona-btn" aria-label="Sign in as Dock Loader Nuwan" onclick="location.href='load_01.html'">
        <div class="persona-icon loader">
          <span class="material-symbols-outlined">inventory_2</span>
        </div>
        <div class="persona-info">
          <div class="persona-role">Loader</div>
          <div class="persona-id">Nuwan · Bay 04</div>
        </div>
      </button>

      <button type="button" class="persona-btn" aria-label="Sign in as Driver Saman" onclick="location.href='drv_01.html'">
        <div class="persona-icon driver">
          <span class="material-symbols-outlined">directions_car</span>
        </div>
        <div class="persona-info">
          <div class="persona-role">Driver</div>
          <div class="persona-id">Saman · VEH-003</div>
        </div>
      </button>
    </div>

    <div class="scenario-bar">
      Seeded: 120 outlets · 60 vehicles · 16:00 cutoff
    </div>

  </main>
</body>
</html>

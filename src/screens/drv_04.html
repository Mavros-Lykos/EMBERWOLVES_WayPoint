<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offload Checklist — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    html { font-size: 16px; }
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 420px; margin: 0 auto; background: var(--md-sys-color-surface); }
    
    .mobile-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .title { font: var(--md-sys-typescale-title-large); }
    
    .page-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    .checklist { display: flex; flex-direction: column; gap: 8px; }
    
    .check-item { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); cursor: pointer; transition: background var(--md-sys-motion-duration-short), border-color var(--md-sys-motion-duration-short); -webkit-tap-highlight-color: transparent; }
    .check-item:active { transform: scale(0.98); }
    .check-item.checked { background: #E8F5E9; border-color: var(--md-sys-color-success); }
    
    .check-icon { width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--md-sys-color-outline); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; transition: all var(--md-sys-motion-duration-short); }
    .check-item.checked .check-icon { background: var(--md-sys-color-success); border-color: var(--md-sys-color-success); color: #fff; }
    
    .check-label { flex: 1; }
    .sku-name { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); margin-bottom: 4px; }
    .sku-meta { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); display: flex; gap: 12px; }
    
    .shortage-btn { height: 40px; padding: 0 12px; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-full); background: transparent; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; font: var(--md-sys-typescale-label-medium); }
    
    .bottom-action { padding: 16px; border-top: 1px solid var(--md-sys-color-outline-variant); }
    .bottom-action .md-filled-button { width: 100%; height: 64px; font: var(--md-sys-typescale-title-medium); }
  </style>
</head>
<body>

  <header class="mobile-top-bar">
    <span class="title">Offload: ORD-8891</span>
    <span class="md-badge" style="background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface-variant)">4 Items</span>
  </header>

  <div class="page-body">
    
    <div class="checklist">
      
      <div class="check-item checked" role="checkbox" aria-checked="true" aria-label="Highland Milk 1L - 24 crates" onclick="this.classList.toggle('checked');this.setAttribute('aria-checked',this.classList.contains('checked'))">
        <div class="check-icon" aria-hidden="true"><span class="material-symbols-outlined">check</span></div>
        <div class="check-label">
          <div class="sku-name">Highland Milk 1L</div>
          <div class="sku-meta"><span>24 Crates</span><span>Chilled</span></div>
        </div>
      </div>
      
      <div class="check-item checked" role="checkbox" aria-checked="true" aria-label="Fresh Poultry Pack - 16 crates" onclick="this.classList.toggle('checked');this.setAttribute('aria-checked',this.classList.contains('checked'))">
        <div class="check-icon" aria-hidden="true"><span class="material-symbols-outlined">check</span></div>
        <div class="check-label">
          <div class="sku-name">Fresh Poultry Pack</div>
          <div class="sku-meta"><span>16 Crates</span><span>Chilled</span></div>
        </div>
      </div>
      
      <div class="check-item" role="checkbox" aria-checked="false" aria-label="Yoghurt 80g - 10 crates" onclick="this.classList.toggle('checked');this.setAttribute('aria-checked',this.classList.contains('checked'))">
        <div class="check-icon" aria-hidden="true"><span class="material-symbols-outlined">check</span></div>
        <div class="check-label">
          <div class="sku-name">Yoghurt 80g</div>
          <div class="sku-meta"><span>10 Crates</span><span>Chilled</span></div>
        </div>
        <button class="shortage-btn" aria-label="Report shortage for Yoghurt 80g" onclick="event.stopPropagation()">Report</button>
      </div>
      
      <div class="check-item" role="checkbox" aria-checked="false" aria-label="Butter 200g - 5 crates" onclick="this.classList.toggle('checked');this.setAttribute('aria-checked',this.classList.contains('checked'))">
        <div class="check-icon" aria-hidden="true"><span class="material-symbols-outlined">check</span></div>
        <div class="check-label">
          <div class="sku-name">Butter 200g</div>
          <div class="sku-meta"><span>5 Crates</span><span>Chilled</span></div>
        </div>
        <button class="shortage-btn" aria-label="Report shortage for Butter 200g" onclick="event.stopPropagation()">Report</button>
      </div>

    </div>

  </div>

  <div class="bottom-action">
    <button class="md-filled-button" aria-label="Complete cargo handoff for this stop">Complete Handoff</button>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Schedule — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    html { font-size: 16px; }
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 420px; margin: 0 auto; background: var(--md-sys-color-surface); }
    
    .mobile-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); margin-left: -8px; margin-right: 8px; }
    .title { font: var(--md-sys-typescale-title-large); }
    
    .page-body { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }

    .date-header { font: var(--md-sys-typescale-headline-small); color: var(--md-sys-color-primary); margin-bottom: 16px; }
    
    .schedule-card { background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); overflow: hidden; margin-bottom: 16px; }
    .sch-header { background: var(--md-sys-color-surface-container); padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .sch-time { font: var(--md-sys-typescale-title-medium); }
    .sch-type { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); padding: 4px 12px; border-radius: 12px; font: var(--md-sys-typescale-label-small); text-transform: uppercase; letter-spacing: 0.04em; }
    
    .sch-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    
    .sch-row { display: flex; align-items: center; gap: 12px; }
    .sch-row .material-symbols-outlined { color: var(--md-sys-color-on-surface-variant); }
    .sch-text { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); }
    .sch-text strong { font-weight: 500; }
    
    .no-more { text-align: center; font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface-variant); padding: 24px 0; }
    
    .bottom-nav { border-top: 1px solid var(--md-sys-color-outline-variant); display: flex; height: 72px; background: var(--md-sys-color-surface); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: var(--md-sys-color-on-surface-variant); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .nav-btn.active { color: var(--md-sys-color-primary); }
    .nav-btn .material-symbols-outlined { font-size: 24px; }
    .nav-btn .nav-label { font: var(--md-sys-typescale-label-small); }
    .nav-btn.active .material-symbols-outlined { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); padding: 4px 16px; border-radius: 16px; }
  </style>
</head>
<body>

  <header class="mobile-top-bar">
    <button class="back-btn"><span class="material-symbols-outlined">arrow_back</span></button>
    <span class="title">My Schedule</span>
  </header>

  <div class="page-body">
    
    <div>
      <div class="date-header">Tomorrow (Wed, Oct 07)</div>
      
      <div class="schedule-card">
        <div class="sch-header">
          <span class="sch-time">05:30 AM Shift</span>
          <span class="sch-type">Chilled Delivery</span>
        </div>
        <div class="sch-body">
          <div class="sch-row">
            <span class="material-symbols-outlined">warehouse</span>
            <span class="sch-text">Start at <strong>Peliyagoda DC (Bay 02)</strong></span>
          </div>
          <div class="sch-row">
            <span class="material-symbols-outlined">local_shipping</span>
            <span class="sch-text">Vehicle: <strong>VEH-012 (Isuzu 4.5T)</strong></span>
          </div>
          <div class="sch-row">
            <span class="material-symbols-outlined">route</span>
            <span class="sch-text">Route: <strong>Negombo Line (5 stops)</strong></span>
          </div>
        </div>
      </div>
      
      <div class="no-more">End of schedule</div>
    </div>

  </div>

  <nav class="bottom-nav" aria-label="Driver app navigation">
    <button class="nav-btn" aria-label="Go to Home"><span class="material-symbols-outlined" aria-hidden="true">home</span><span class="nav-label">Home</span></button>
    <button class="nav-btn active" aria-current="page" aria-label="Schedule - current section"><span class="material-symbols-outlined" aria-hidden="true">calendar_today</span><span class="nav-label">Schedule</span></button>
    <button class="nav-btn" aria-label="Driver profile"><span class="material-symbols-outlined" aria-hidden="true">person</span><span class="nav-label">Profile</span></button>
  </nav>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emergency Report — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    html { font-size: 16px; }
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 420px; margin: 0 auto; background: var(--md-sys-color-surface); }
    
    .mobile-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); margin-left: -8px; margin-right: 8px; }
    .title { font: var(--md-sys-typescale-title-large); }
    
    .page-body { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 32px; }

    .sos-button { width: 160px; height: 160px; border-radius: 80px; background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); border: none; box-shadow: 0 12px 24px rgba(186,26,26,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
    .sos-button:active { transform: scale(0.95); box-shadow: 0 4px 12px rgba(186,26,26,0.3); }
    .sos-button .material-symbols-outlined { font-size: 48px; }
    .sos-text { font: var(--md-sys-typescale-title-large); font-weight: 700; letter-spacing: 0.1em; }

    .loc-card { width: 100%; background: var(--md-sys-color-surface-container-low); border-radius: var(--md-sys-shape-corner-md); padding: 16px; display: flex; align-items: center; gap: 16px; }
    .loc-card .material-symbols-outlined { color: var(--md-sys-color-primary); font-size: 32px; }
    .loc-info { display: flex; flex-direction: column; gap: 4px; }
    .loc-title { font: var(--md-sys-typescale-label-medium); color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; }
    .loc-val { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); font-weight: 500; }

    .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .type-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 100px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface-variant); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .type-btn:active { background: var(--md-sys-color-surface-container); }
    .type-btn.active { border-color: var(--md-sys-color-error); background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
    .type-btn .material-symbols-outlined { font-size: 28px; }
    .type-label { font: var(--md-sys-typescale-label-large); }
  </style>
</head>
<body>

  <header class="mobile-top-bar">
    <button class="back-btn" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
    <span class="title">Emergency</span>
  <span class="md-badge success" style="margin-left:auto; margin-right: 16px;"><span class="material-symbols-outlined" style="font-size:14px">cloud_done</span> Online</span>
</header>

  <div class="page-body">
    
    <button class="sos-button" aria-label="Broadcast SOS emergency to dispatch">
      <span class="material-symbols-outlined">satellite_alt</span>
      <span class="sos-text">BROADCAST</span>
    </button>
    
    <div class="loc-card">
      <span class="material-symbols-outlined">my_location</span>
      <div class="loc-info">
        <span class="loc-title">Current Location</span>
        <span class="loc-val">Kaduwela Road, Malabe<br><span style="font-size:12px;opacity:0.8">6.9042° N, 79.9576° E</span></span>
      </div>
    </div>
    
    <div style="width:100%">
      <div style="font:var(--md-sys-typescale-label-medium);color:var(--md-sys-color-on-surface-variant);margin-bottom:12px;text-transform:uppercase;">Select Issue Type</div>
      <div class="type-grid">
        <div class="type-btn active" role="radio" aria-checked="true" aria-label="Engine or breakdown issue">
          <span class="material-symbols-outlined">car_crash</span>
          <span class="type-label">Engine / Breakdown</span>
        </div>
        <div class="type-btn" role="radio" aria-checked="false" aria-label="Flat tire issue"><span class="material-symbols-outlined" aria-hidden="true">tire_repair</span>
          <span class="type-label">Flat Tire</span>
        </div>
        <div class="type-btn" role="radio" aria-checked="false" aria-label="Refrigeration failure issue"><span class="material-symbols-outlined" aria-hidden="true">ac_unit</span>
          <span class="type-label">Reefer Failure</span>
        </div>
        <div class="type-btn" role="radio" aria-checked="false" aria-label="Medical or accident issue"><span class="material-symbols-outlined" aria-hidden="true">medical_services</span>
          <span class="type-label">Medical / Accident</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>

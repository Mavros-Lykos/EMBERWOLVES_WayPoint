<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Navigation — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    html { font-size: 16px; }
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 420px; margin: 0 auto; background: var(--md-sys-color-surface-container-lowest); }
    
    .map-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .map-pattern { width: 100%; height: 100%; background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="%23cccccc" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)" /></svg>'); }
    
    .nav-header { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); padding: 16px; box-shadow: var(--md-sys-elevation-2); display: flex; gap: 16px; align-items: center; }
    .turn-icon { font-size: 48px; font-weight: 700; }
    .turn-info { flex: 1; }
    .dist-val { font: var(--md-sys-typescale-display-small); font-weight: 700; margin-bottom: 4px; }
    .street-name { font: var(--md-sys-typescale-title-medium); opacity: 0.9; }

    .offline-pill { position: absolute; top: 110px; right: 16px; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); padding: 6px 12px; border-radius: var(--md-sys-shape-corner-full); font: var(--md-sys-typescale-label-medium); box-shadow: var(--md-sys-elevation-2); display: flex; align-items: center; gap: 6px; }
    
    .nav-footer { margin-top: auto; background: var(--md-sys-color-surface); box-shadow: 0 -2px 8px rgba(0,0,0,0.1); padding: 16px; border-radius: 24px 24px 0 0; }
    
    .dest-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .eta-val { font: var(--md-sys-typescale-display-medium); color: var(--md-sys-color-success); font-weight: 700; }
    .dest-meta { font: var(--md-sys-typescale-title-medium); color: var(--md-sys-color-on-surface-variant); }
    
    .dest-name { font: var(--md-sys-typescale-headline-small); margin-bottom: 16px; }
    
    .action-row { display: flex; gap: 8px; }
    .action-row .md-filled-button { flex: 1; height: 64px; font: var(--md-sys-typescale-title-medium); }
    .action-row .md-outlined-button { height: 64px; width: 64px; display: flex; align-items: center; justify-content: center; padding: 0; }
  </style>
</head>
<body>

  <div class="map-bg"><div class="map-pattern"></div></div>

  <header class="nav-header" aria-label="Navigation direction">
    <span class="material-symbols-outlined turn-icon" aria-hidden="true">turn_right</span>
    <div class="turn-info">
      <div class="dist-val" aria-label="Distance: 300 metres">300 m</div>
      <div class="street-name">Galle Road (A2)</div>
    </div>
  </header>

  <div class="offline-pill">
    <span class="material-symbols-outlined" style="font-size:16px;color:var(--md-sys-color-primary)">cloud_off</span>
    Offline map active
  </div>

  <main class="nav-footer" aria-label="Trip destination">
    <div class="dest-row">
      <div class="eta-val" aria-label="ETA 6:40 AM">06:40</div>
      <div class="dest-meta">14 min · 6.2 km</div>
    </div>
    <div class="dest-name">OUT-007 · Mt. Lavinia</div>
    
    <div class="action-row">
      <button class="md-outlined-button" aria-label="Call store manager"><span class="material-symbols-outlined" aria-hidden="true">call</span></button>
      <button class="md-filled-button" aria-label="Mark as arrived at store">Arrived at Store</button>
    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Order — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; min-height: 100vh; }
    .nav-rail { width: 80px; background: var(--md-sys-color-surface-container); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; border-right: 1px solid var(--md-sys-color-outline-variant); flex-shrink: 0; }
    .nav-rail .brand-mark { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .nav-rail .brand-mark .material-symbols-outlined { color: var(--md-sys-color-primary); font-size: 28px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; width: 100%; cursor: pointer; color: var(--md-sys-color-on-surface-variant); border: none; background: none; }
    .nav-item.active .icon-wrap { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-radius: var(--md-sys-shape-corner-full); padding: 4px 20px; }
    .nav-item .label { font: var(--md-sys-typescale-label-medium); }
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { height: 64px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .top-bar .page-title { font: var(--md-sys-typescale-title-large); }
    .cutoff-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-radius: var(--md-sys-shape-corner-full); font: var(--md-sys-typescale-label-large); }

    .page-body { flex: 1; overflow-y: auto; padding: 24px; display: grid; grid-template-columns: 1fr 320px; gap: 24px; }

    /* Category tabs */
    .cat-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .cat-tab { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: var(--md-sys-shape-corner-full); border: 1px solid var(--md-sys-color-outline); background: transparent; font: var(--md-sys-typescale-label-large); color: var(--md-sys-color-on-surface-variant); cursor: pointer; transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard); }
    .cat-tab.active { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-color: transparent; }
    .cat-tab:hover:not(.active) { background: rgba(0,0,0,0.04); }

    /* Search */
    .search-field { position: relative; margin-bottom: 16px; }
    .search-field input { width: 100%; height: 48px; padding: 0 16px 0 48px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-full); background: var(--md-sys-color-surface-container-low); font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); }
    .search-field input:focus { outline: none; border-color: var(--md-sys-color-primary); border-width: 2px; padding-left: 47px; }
    .search-field .material-symbols-outlined { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--md-sys-color-on-surface-variant); }

    /* Item list */
    .item-list { display: flex; flex-direction: column; gap: 4px; }
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: var(--md-sys-shape-corner-sm); transition: background var(--md-sys-motion-duration-short); }
    .item-row:hover { background: var(--md-sys-color-surface-container-low); }
    .item-info { display: flex; flex-direction: column; gap: 2px; }
    .item-sku { font: var(--md-sys-typescale-label-small); color: var(--md-sys-color-on-surface-variant); }
    .item-name { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); }
    .qty-control { display: flex; align-items: center; gap: 4px; }
    .qty-btn { width: 36px; height: 36px; border-radius: var(--md-sys-shape-corner-full); border: 1px solid var(--md-sys-color-outline); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--md-sys-color-primary); }
    .qty-btn:active { background: var(--md-sys-color-primary-container); }
    .qty-val { width: 48px; text-align: center; font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); }

    /* Manifest sidebar */
    .manifest { display: flex; flex-direction: column; gap: 16px; }
    .manifest-card { background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); padding: 20px; }
    .manifest-title { font: var(--md-sys-typescale-title-medium); margin-bottom: 16px; }
    .manifest-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .manifest-row:last-child { border-bottom: none; }
    .manifest-key { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface-variant); }
    .manifest-val { font: var(--md-sys-typescale-label-large); color: var(--md-sys-color-on-surface); }

    @media (max-width: 1024px) { .nav-rail { display: none; } .page-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="nav-rail" aria-label="Main navigation">
    <div class="brand-mark"><span class="material-symbols-outlined">local_shipping</span></div>
    <button class="nav-item" onclick="location.href='store_01.html'"><span class="icon-wrap"><span class="material-symbols-outlined">dashboard</span></span><span class="label">Home</span></button>
    <button class="nav-item active" aria-current="page" onclick="location.href='store_02.html'"><span class="icon-wrap"><span class="material-symbols-outlined">add_shopping_cart</span></span><span class="label">Order</span></button>
    <button class="nav-item" onclick="location.href='store_04.html'"><span class="icon-wrap"><span class="material-symbols-outlined">history</span></span><span class="label">History</span></button>
    <button class="nav-item" onclick="location.href='store_05.html'"><span class="icon-wrap"><span class="material-symbols-outlined">dock_to_bottom</span></span><span class="label">Receive</span></button>
  </nav>
  <div class="main-content">
    <header class="top-bar">
      <span class="page-title">New order for Tue, Oct 06</span>
      <div class="cutoff-chip"><span class="material-symbols-outlined" style="font-size:18px">schedule</span>Cutoff: 01h 45m</div>
    </header>
    <div class="page-body">
      <div>
        <div class="cat-tabs">
          <button class="cat-tab active" onclick="this.parentElement.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));this.classList.add('active');">Fresh Ambient</button>
          <button class="cat-tab" onclick="this.parentElement.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));this.classList.add('active');">Chilled</button>
          <button class="cat-tab" onclick="this.parentElement.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));this.classList.add('active');">Style</button>
          <button class="cat-tab" onclick="this.parentElement.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));this.classList.add('active');">Tech</button>
        </div>
        <div class="search-field">
          <span class="material-symbols-outlined">search</span>
          <input type="text" placeholder="Search SKU or item name">
        </div>
        <div class="item-list">
          <div class="item-row"><div class="item-info"><span class="item-sku">SKU-101</span><span class="item-name">Rice Samba 5kg</span></div><div class="qty-control"><button class="qty-btn" aria-label="Decrease Rice Samba" onclick="const v = this.nextElementSibling; v.innerText = Math.max(0, parseInt(v.innerText)-5);"><span class="material-symbols-outlined" style="font-size:18px">remove</span></button><span class="qty-val">40</span><button class="qty-btn" aria-label="Increase Rice Samba" onclick="const v = this.previousElementSibling; v.innerText = parseInt(v.innerText)+5;"><span class="material-symbols-outlined" style="font-size:18px">add</span></button></div></div>
          <div class="item-row"><div class="item-info"><span class="item-sku">SKU-102</span><span class="item-name">White Sugar 1kg</span></div><div class="qty-control"><button class="qty-btn" aria-label="Decrease White Sugar" onclick="const v = this.nextElementSibling; v.innerText = Math.max(0, parseInt(v.innerText)-5);"><span class="material-symbols-outlined" style="font-size:18px">remove</span></button><span class="qty-val">80</span><button class="qty-btn" aria-label="Increase White Sugar" onclick="const v = this.previousElementSibling; v.innerText = parseInt(v.innerText)+5;"><span class="material-symbols-outlined" style="font-size:18px">add</span></button></div></div>
          <div class="item-row"><div class="item-info"><span class="item-sku">SKU-109</span><span class="item-name">Dhal 1kg</span></div><div class="qty-control"><button class="qty-btn" aria-label="Decrease Dhal" onclick="const v = this.nextElementSibling; v.innerText = Math.max(0, parseInt(v.innerText)-5);"><span class="material-symbols-outlined" style="font-size:18px">remove</span></button><span class="qty-val">60</span><button class="qty-btn" aria-label="Increase Dhal" onclick="const v = this.previousElementSibling; v.innerText = parseInt(v.innerText)+5;"><span class="material-symbols-outlined" style="font-size:18px">add</span></button></div></div>
          <div class="item-row"><div class="item-info"><span class="item-sku">SKU-214</span><span class="item-name">Canned Fish 425g</span></div><div class="qty-control"><button class="qty-btn" aria-label="Decrease Canned Fish" onclick="const v = this.nextElementSibling; v.innerText = Math.max(0, parseInt(v.innerText)-5);"><span class="material-symbols-outlined" style="font-size:18px">remove</span></button><span class="qty-val">30</span><button class="qty-btn" aria-label="Increase Canned Fish" onclick="const v = this.previousElementSibling; v.innerText = parseInt(v.innerText)+5;"><span class="material-symbols-outlined" style="font-size:18px">add</span></button></div></div>
        </div>
      </div>
      <aside class="manifest">
        <div class="manifest-card">
          <div class="manifest-title">Order summary</div>
          <div class="manifest-row"><span class="manifest-key">Outlet</span><span class="manifest-val">OUT-007</span></div>
          <div class="manifest-row"><span class="manifest-key">Access</span><span class="manifest-val">Heavy truck OK</span></div>
          <div class="manifest-row"><span class="manifest-key">Items</span><span class="manifest-val">18 SKUs</span></div>
          <div class="manifest-row"><span class="manifest-key">Weight</span><span class="manifest-val">1,420 kg</span></div>
          <div class="manifest-row"><span class="manifest-key">Volume</span><span class="manifest-val">3.4 m³</span></div>
        </div>
        <button class="md-filled-button" style="width:100%;height:48px" onclick="location.href='store_03.html'">Submit order</button>
        <button class="md-text-button" style="width:100%" onclick="if(confirm('Clear all items from current order?')) { document.querySelectorAll('.qty-val').forEach(v=>v.innerText='0'); }">Clear basket</button>
      </aside>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dock Receiving — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 820px; margin: 0 auto; }
    .top-bar { height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); }
    .top-bar .page-title { font: var(--md-sys-typescale-title-large); }
    .page-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
    .step-card { background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); padding: 24px; }
    .step-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .step-number { width: 32px; height: 32px; border-radius: var(--md-sys-shape-corner-full); background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); display: flex; align-items: center; justify-content: center; font: var(--md-sys-typescale-label-large); flex-shrink: 0; }
    .step-title { font: var(--md-sys-typescale-title-medium); }

    /* Seal input */
    .seal-input-row { display: flex; gap: 8px; align-items: center; }
    .seal-label { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface-variant); margin-right: 8px; }
    .seal-digit { width: 48px; height: 56px; text-align: center; font: var(--md-sys-typescale-headline-medium); border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-xs); background: transparent; color: var(--md-sys-color-on-surface); }
    .seal-digit:focus { outline: none; border-color: var(--md-sys-color-primary); border-width: 2px; }
    .seal-verified { display: inline-flex; align-items: center; gap: 4px; padding: 6px 16px; background: #E8F5E9; color: var(--md-sys-color-success); border-radius: var(--md-sys-shape-corner-full); font: var(--md-sys-typescale-label-large); margin-left: 12px; }

    /* Temp */
    .temp-row { display: flex; align-items: center; gap: 12px; }
    .temp-val { font: var(--md-sys-typescale-headline-medium); color: var(--md-sys-color-on-surface); }
    .temp-range { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }

    /* Manifest checklist */
    .manifest-list { display: flex; flex-direction: column; gap: 8px; }
    .manifest-item { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 12px 16px; background: var(--md-sys-color-surface-container-low); border-radius: var(--md-sys-shape-corner-sm); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .manifest-item.checked { background: #E8F5E9; }
    .manifest-item.short { background: #FFF3E0; }
    .manifest-check { width: 24px; height: 24px; border-radius: var(--md-sys-shape-corner-xs); border: 2px solid var(--md-sys-color-outline); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .manifest-item.checked .manifest-check { background: var(--md-sys-color-success); border-color: var(--md-sys-color-success); color: #fff; }
    .manifest-item.short .manifest-check { background: var(--md-sys-color-warning); border-color: var(--md-sys-color-warning); color: #fff; }
    .manifest-info { flex: 1; }
    .manifest-name { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); }
    .manifest-count { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }

    .bottom-action { padding: 16px 24px; border-top: 1px solid var(--md-sys-color-outline-variant); display: flex; gap: 8px; }
    .bottom-action .md-filled-button { flex: 1; height: 64px; font: var(--md-sys-typescale-title-medium); }
    .bottom-action .md-outlined-button { height: 64px; }
  </style>
</head>
<body>
  <header class="top-bar">
    <button class="back-btn" aria-label="Back" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
    <span class="page-title">Receiving: Trip #TRIP-104</span>
    <span style="margin-left:auto; font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant);">VEH-003 · Saman K.</span>
  </header>
  <div class="page-body">

    <div class="step-card">
      <div class="step-header"><div class="step-number">1</div><span class="step-title">Seal verification</span></div>
      <div class="seal-input-row">
        <span class="seal-label">SL-</span>
        <input class="seal-digit" type="text" maxlength="1" value="9" aria-label="Seal digit 1">
        <input class="seal-digit" type="text" maxlength="1" value="9" aria-label="Seal digit 2">
        <input class="seal-digit" type="text" maxlength="1" value="4" aria-label="Seal digit 3">
        <input class="seal-digit" type="text" maxlength="1" value="2" aria-label="Seal digit 4">
        <span class="seal-verified"><span class="material-symbols-outlined" style="font-size:16px">verified</span> Verified</span>
      </div>
    </div>

    <div class="step-card">
      <div class="step-header"><div class="step-number">2</div><span class="step-title">Temperature check</span></div>
      <div class="temp-row">
        <span class="temp-val">3.2°C</span>
        <span class="seal-verified"><span class="material-symbols-outlined" style="font-size:16px">check</span> Normal</span>
        <span class="temp-range">(0°C – 4°C)</span>
      </div>
    </div>

    <div class="step-card">
      <div class="step-header"><div class="step-number">3</div><span class="step-title">Crate audit</span></div>
      <div class="manifest-list">
        <div class="manifest-item checked" onclick="this.classList.toggle('checked')">
          <div class="manifest-check"><span class="material-symbols-outlined" style="font-size:16px">check</span></div>
          <div class="manifest-info">
            <div class="manifest-name">Highland Milk 1L</div>
            <div class="manifest-count">24 / 24 crates</div>
          </div>
        </div>
        <div class="manifest-item checked" onclick="this.classList.toggle('checked')">
          <div class="manifest-check"><span class="material-symbols-outlined" style="font-size:16px">check</span></div>
          <div class="manifest-info">
            <div class="manifest-name">Fresh Poultry Chilled</div>
            <div class="manifest-count">16 / 16 crates</div>
          </div>
        </div>
        <div class="manifest-item short">
          <div class="manifest-check"><span class="material-symbols-outlined" style="font-size:16px">warning</span></div>
          <div class="manifest-info">
            <div class="manifest-name">Yoghurt 80g</div>
            <div class="manifest-count" style="color: var(--md-sys-color-warning);">8 / 10 crates — 2 short</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-action">
    <button class="md-outlined-button" onclick="location.href='store_06.html'">Report shortage</button>
    <button class="md-filled-button" onclick="location.href='store_01.html'">Confirm receipt</button>
  </div>
</body>
</html>

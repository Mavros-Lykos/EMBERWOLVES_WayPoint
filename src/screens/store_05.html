<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORE-05: Live Receiving - Waypoint Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0ea5e9',
            'primary-hover': '#0284c7',
            success: '#10b981',
            warning: '#f59e0b',
            critical: '#ef4444',
            canvas: '#f8fafc',
            surface: '#ffffff',
            'surface-glass': 'rgba(255, 255, 255, 0.9)',
            muted: '#64748b',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
    
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        .fatigue-btn { min-height: 64px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.125rem; border-radius: 0.75rem; }
        .glass-panel { background: var(--tw-colors-surface-glass); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.08); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">
    
    <!-- Global Header -->
    <header class="bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-3xl">local_shipping</span>
            <div>
                <h1 class="font-semibold text-lg leading-tight tracking-tight">Waypoint Dispatch</h1>
                <span class="text-xs font-mono text-muted uppercase">store Portal</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-mono bg-emerald-100 text-emerald-700">
                <span class="material-symbols-outlined text-[16px]">wifi</span> Online (WebSocket)
            </div>
            <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-slate-100 transition-colors">
                <span class="material-symbols-outlined">contrast</span>
            </button>
            <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-slate-100 transition-colors">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-x-hidden">
        
    <div class="p-6 md:p-8 max-w-5xl mx-auto h-[calc(100vh-70px)] flex flex-col items-center justify-center">
        <div class="text-center mb-8">
            <span class="material-symbols-outlined text-6xl text-primary mb-4">construction</span>
            <h2 class="text-3xl font-bold mb-2">STORE-05: Live Receiving</h2>
            <p class="text-slate-500 text-lg">Live Receiving & Seal Verification Gate</p>
        </div>
        
        <div class="w-full max-w-2xl bg-white border-slate-200 border rounded-2xl p-8 shadow-sm flex flex-col items-center text-center">
            <p class="mb-6 font-mono text-sm opacity-70">This screen interface acts as a placeholder for the full UI implementation as per Waypoint Dispatch design standards.</p>
            <button class="fatigue-btn bg-primary hover:bg-primary-hover text-white px-8">Return to Dashboard</button>
        </div>
    </div>
    
    </main>


<script>
document.querySelectorAll('.material-symbols-outlined').forEach(async (el) => {
  const iconName = el.innerText.trim().replace(/_/g, '-');
  const res = await fetch(`https://api.iconify.design/material-symbols/${iconName}-outline.svg`);
  if (res.ok) {
    let svg = await res.text();
    el.innerHTML = svg.replace('<svg ', '<svg style="width:1em; height:1em; display:inline-block;" ');
  }
});
</script>
</body>

</html>

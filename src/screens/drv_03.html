<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arrival Verification — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    html { font-size: 16px; }
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 420px; margin: 0 auto; background: var(--md-sys-color-surface); }
    
    .mobile-top-bar { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); margin-left: -8px; margin-right: 8px; }
    .title { font: var(--md-sys-typescale-title-large); }
    
    .page-body { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; align-items: center; }

    .handoff-banner { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); padding: 16px; border-radius: var(--md-sys-shape-corner-md); display: flex; gap: 12px; width: 100%; }
    .banner-text { font: var(--md-sys-typescale-body-large); font-weight: 500; }
    
    .seal-box { background: var(--md-sys-color-surface-container-lowest); border: 2px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-lg); padding: 24px 16px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
    
    .seal-inst { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface-variant); margin-bottom: 16px; }
    
    .seal-input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; }
    .seal-label { font: var(--md-sys-typescale-headline-medium); color: var(--md-sys-color-on-surface-variant); }
    .seal-digit { width: 48px; height: 64px; text-align: center; font: var(--md-sys-typescale-headline-large); border: 2px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-sm); background: transparent; color: var(--md-sys-color-on-surface); }
    .seal-digit:focus { outline: none; border-color: var(--md-sys-color-primary); }
    
    .pin-input { width: 100%; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-sm); padding: 16px; font: var(--md-sys-typescale-body-large); text-align: center; background: transparent; }
    .pin-input:focus { outline: none; border-color: var(--md-sys-color-primary); border-width: 2px; padding: 15px; }

    .bottom-action { padding: 16px; border-top: 1px solid var(--md-sys-color-outline-variant); }
    .bottom-action .md-filled-button { width: 100%; height: 64px; font: var(--md-sys-typescale-title-medium); }
  </style>
</head>
<body>

  <header class="mobile-top-bar">
    <button class="back-btn"><span class="material-symbols-outlined">arrow_back</span></button>
    <span class="title">OUT-007 Arrival</span>
  </header>

  <div class="page-body">
    
    <div class="handoff-banner">
      <span class="material-symbols-outlined" style="font-size: 28px;">mobile_friendly</span>
      <div class="banner-text">Hand device to Store Manager (Priya K.) for verification.</div>
    </div>
    
    <div class="seal-box">
      <div class="seal-inst">Verify the physical seal matches the manifest, then enter the 4-digit code.</div>
      
      <div class="seal-input-row">
        <span class="seal-label">SL -</span>
        <input class="seal-digit" type="tel" maxlength="1" aria-label="Seal digit 1">
        <input class="seal-digit" type="tel" maxlength="1" aria-label="Seal digit 2">
        <input class="seal-digit" type="tel" maxlength="1" aria-label="Seal digit 3">
        <input class="seal-digit" type="tel" maxlength="1" aria-label="Seal digit 4">
      </div>
      
      <input type="password" class="pin-input" placeholder="Manager PIN">
    </div>

  </div>

  <div class="bottom-action">
    <button class="md-filled-button">Unlock Cargo Doors</button>
  </div>
  
  <script>
    const inputs = document.querySelectorAll('.seal-digit');
    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if(input.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seal Lockdown — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 820px; margin: 0 auto; background: var(--md-sys-color-surface); }
    .top-bar { height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); }
    .page-title { font: var(--md-sys-typescale-title-large); }

    .page-body { flex: 1; overflow-y: auto; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }

    .lock-icon-wrap { width: 96px; height: 96px; border-radius: 48px; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); display: flex; align-items: center; justify-content: center; }
    
    .instruction-text { text-align: center; max-width: 400px; }
    .inst-title { font: var(--md-sys-typescale-headline-small); margin-bottom: 8px; }
    .inst-sub { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface-variant); }

    .seal-input-box { background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-lg); padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 480px; }
    
    .seal-input-row { display: flex; gap: 12px; align-items: center; }
    .seal-label { font: var(--md-sys-typescale-headline-medium); color: var(--md-sys-color-on-surface-variant); }
    .seal-digit { width: 64px; height: 80px; text-align: center; font: var(--md-sys-typescale-display-small); border: 2px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-sm); background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); transition: border-color var(--md-sys-motion-duration-short); }
    .seal-digit:focus { outline: none; border-color: var(--md-sys-color-primary); background: var(--md-sys-color-surface-container-lowest); }

    .action-row { padding: 24px; border-top: 1px solid var(--md-sys-color-outline-variant); display: flex; gap: 16px; width: 100%; }
    .action-row .md-filled-button { flex: 1; height: 64px; font: var(--md-sys-typescale-title-medium); }
  </style>
</head>
<body>

  <header class="top-bar">
    <button class="back-btn" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
    <div class="page-title">Finalize Departure: VEH-003</div>
  <span class="md-badge success" style="margin-left:auto; margin-right: 16px;"><span class="material-symbols-outlined" style="font-size:14px">cloud_done</span> Online</span>
</header>

  <div class="page-body">
    
    <div class="lock-icon-wrap">
      <span class="material-symbols-outlined" style="font-size: 48px;">lock</span>
    </div>
    
    <div class="instruction-text">
      <div class="inst-title">Attach Security Seal</div>
      <div class="inst-sub">Lock the cargo doors and enter the 4-digit physical seal number below.</div>
    </div>
    
    <div class="seal-input-box">
      <div class="seal-input-row">
        <span class="seal-label">SL -</span>
        <input class="seal-digit" type="text" maxlength="1" aria-label="Seal digit 1" autofocus>
        <input class="seal-digit" type="text" maxlength="1" aria-label="Seal digit 2">
        <input class="seal-digit" type="text" maxlength="1" aria-label="Seal digit 3">
        <input class="seal-digit" type="text" maxlength="1" aria-label="Seal digit 4">
      </div>
    </div>

  </div>

  <div class="action-row">
    <button class="md-filled-button">Lockdown & Dispatch</button>
  </div>
  
  <script>
    // Auto-advance for demo
    const inputs = document.querySelectorAll('.seal-digit');
    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if(input.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
    });
  </script>
</body>
</html>

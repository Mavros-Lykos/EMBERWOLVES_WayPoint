<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pallet Shortfall & Damage Flag — Waypoint Depot</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: rgba(15,23,42,0.8); padding: 24px; margin: 0; font-family: 'Roboto', sans-serif; }
    .modal-surface { width: 100%; max-width: 640px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); color: #f8fafc; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; background: #0f172a; }
    .modal-title { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; color: #f59e0b; margin: 0; }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .info-strip { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label { font-size: 0.875rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .count-control { display: flex; align-items: center; gap: 16px; }
    .count-btn { width: 48px; height: 48px; border-radius: 8px; background: #334155; border: 1px solid #475569; color: white; font-size: 1.5rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .count-input { width: 100px; height: 48px; text-align: center; font-size: 1.5rem; font-weight: bold; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: white; }
    .reason-select { width: 100%; height: 48px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: white; padding: 0 16px; font-size: 1rem; }
    .photo-drop { border: 2px dashed #475569; border-radius: 8px; padding: 24px; text-align: center; color: #94a3b8; cursor: pointer; background: rgba(15,23,42,0.4); }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #334155; display: flex; justify-content: flex-end; gap: 12px; background: #0f172a; }
    .btn-secondary { height: 48px; padding: 0 20px; border-radius: 8px; background: transparent; border: 1px solid #475569; color: #cbd5e1; font-weight: 500; cursor: pointer; }
    .btn-primary { height: 48px; padding: 0 24px; border-radius: 8px; background: #f59e0b; border: none; color: #000; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="modal-surface" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title">
        <span class="material-symbols-outlined">report_problem</span>
        Pallet Shortfall & Damage Flag
      </h2>
      <span style="background: rgba(245, 158, 11, 0.2); color: #f59e0b; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;">LOAD-04</span>
    </div>
    
    <div class="modal-body">
      <div class="info-strip">
        <div style="font-weight: 600; color: #e2e8f0;">Affected Manifest: Pallet #P-104 (OUT007 Fresh Mount Lavinia)</div>
        <div style="font-size: 0.875rem; color: #94a3b8;">SKU: Highland Whole Milk 1L Packets | Expected: 40 Crates</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="actualCount">Actual Quantity Loaded</label>
        <div class="count-control">
          <button type="button" class="count-btn" onclick="let el=document.getElementById('actualCount'); el.value = Math.max(0, parseInt(el.value)-1);">-</button>
          <input id="actualCount" class="count-input" type="number" value="36" min="0" max="40" aria-label="Actual loaded count">
          <button type="button" class="count-btn" onclick="let el=document.getElementById('actualCount'); el.value = Math.min(40, parseInt(el.value)+1);">+</button>
          <span style="color: #f87171; font-weight: 500;">4 Crates Missing / Damaged</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reasonSelect">Discrepancy Reason</label>
        <select id="reasonSelect" class="reason-select">
          <option value="forklift_damage">Damaged by Forklift at Bay</option>
          <option value="stock_depleted">Cold Room Stock Depleted / Short-Docked</option>
          <option value="packaging_leak">Container Leakage / Spoilage</option>
          <option value="wrong_item">Incorrect Item Staged on Pallet</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Photo Evidence</label>
        <div class="photo-drop" onclick="alert('Camera capture simulated')">
          <span class="material-symbols-outlined" style="font-size: 32px; color: #94a3b8;">photo_camera</span>
          <div>Tap to capture proof photo of damaged crate</div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-secondary" onclick="window.history.back()">Cancel</button>
      <button type="button" class="btn-primary" onclick="alert('Shortfall logged. Invoice recalculated and Dispatch notified.'); window.location.href='load_03.html'">
        <span class="material-symbols-outlined">save</span>
        Confirm Shortfall & Recalculate
      </button>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pre-Trip Inspection — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    html { font-size: 16px; }
    body {
      display: flex; flex-direction: column;
      min-height: 100vh; max-width: 420px; margin: 0 auto;
    }

    .mobile-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .mobile-top-bar .title {
      font: var(--md-sys-typescale-title-medium);
    }
    .sync-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      border-radius: var(--md-sys-shape-corner-full);
      font: var(--md-sys-typescale-label-small);
    }
    .sync-badge.online { background: #E8F5E9; color: var(--md-sys-color-success); }

    .vehicle-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: var(--md-sys-color-surface-container-low);
    }
    .vehicle-id {
      font: var(--md-sys-typescale-label-large);
      color: var(--md-sys-color-on-surface);
    }
    .driver-name {
      font: var(--md-sys-typescale-body-small);
      color: var(--md-sys-color-on-surface-variant);
    }

    /* --- Checklist --- */
    .checklist {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 8px;
    }

    .check-item {
      display: flex; align-items: center; gap: 16px;
      min-height: 64px;
      padding: 12px 16px;
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-md);
      cursor: pointer;
      transition: background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
      -webkit-tap-highlight-color: transparent;
    }
    .check-item:active { transform: scale(0.98); }
    .check-item.checked {
      background: #E8F5E9;
      border-color: var(--md-sys-color-success);
    }

    .check-icon {
      width: 40px; height: 40px;
      border-radius: var(--md-sys-shape-corner-full);
      border: 2px solid var(--md-sys-color-outline);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: transparent;
      transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }
    .check-item.checked .check-icon {
      background: var(--md-sys-color-success);
      border-color: var(--md-sys-color-success);
      color: #fff;
    }

    .check-label {
      font: var(--md-sys-typescale-body-large);
      color: var(--md-sys-color-on-surface);
      flex: 1;
    }
    .check-detail {
      font: var(--md-sys-typescale-body-small);
      color: var(--md-sys-color-on-surface-variant);
    }

    /* --- Bottom Action --- */
    .bottom-action {
      padding: 16px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: flex; gap: 8px;
    }
    .bottom-action .md-filled-button {
      flex: 1; height: 64px;
      font: var(--md-sys-typescale-title-medium);
    }
    .bottom-action .md-outlined-button {
      height: 64px; min-width: 64px; padding: 0 16px;
    }
  </style>
</head>
<body>

  <header class="mobile-top-bar">
    <span class="title">Pre-Trip Inspection</span>
    <span class="sync-badge online">
      <span class="material-symbols-outlined" style="font-size:14px">cloud_done</span>
      Synced
    </span>
  </header>

  <div class="vehicle-bar">
    <span class="vehicle-id">VEH-003 · Isuzu 4.5T Reefer</span>
    <span class="driver-name">Saman K.</span>
  </div>

  <div class="checklist" role="list" aria-label="Pre-trip inspection checklist">

    <div class="check-item checked" role="listitem" tabindex="0" onclick="this.classList.toggle('checked')">
      <div class="check-icon"><span class="material-symbols-outlined">check</span></div>
      <div>
        <div class="check-label">Tires & wheel nuts</div>
      </div>
    </div>

    <div class="check-item checked" role="listitem" tabindex="0" onclick="this.classList.toggle('checked')">
      <div class="check-icon"><span class="material-symbols-outlined">check</span></div>
      <div>
        <div class="check-label">Foot & hand brakes</div>
      </div>
    </div>

    <div class="check-item checked" role="listitem" tabindex="0" onclick="this.classList.toggle('checked')">
      <div class="check-icon"><span class="material-symbols-outlined">check</span></div>
      <div>
        <div class="check-label">Headlights & hazard flashers</div>
      </div>
    </div>

    <div class="check-item" role="listitem" tabindex="0" onclick="this.classList.toggle('checked')">
      <div class="check-icon"><span class="material-symbols-outlined">check</span></div>
      <div>
        <div class="check-label">Wipers & washer fluid</div>
      </div>
    </div>

    <div class="check-item" role="listitem" tabindex="0" onclick="this.classList.toggle('checked')">
      <div class="check-icon"><span class="material-symbols-outlined">check</span></div>
      <div>
        <div class="check-label">Fuel ≥ 80%</div>
      </div>
    </div>

    <div class="check-item checked" role="listitem" tabindex="0" onclick="this.classList.toggle('checked')">
      <div class="check-icon"><span class="material-symbols-outlined">check</span></div>
      <div>
        <div class="check-label">Reefer temp</div>
        <div class="check-detail">2.9°C (≤ 4.0°C)</div>
      </div>
    </div>

    <div class="check-item checked" role="listitem" tabindex="0" onclick="this.classList.toggle('checked')">
      <div class="check-icon"><span class="material-symbols-outlined">check</span></div>
      <div>
        <div class="check-label">Rear seal intact</div>
        <div class="check-detail">SL-9942</div>
      </div>
    </div>

  </div>

  <div class="bottom-action">
    <button class="md-outlined-button" aria-label="Report defect" onclick="alert('Defect report logged. Bay Supervisor Nuwan notified.');">
      <span class="material-symbols-outlined">warning</span>
    </button>
    <button class="md-filled-button" onclick="location.href='drv_02.html'">
      Unlock route
    </button>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRV-01 | Waypoint Dispatch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #080d1a; 
            color: #f8fafc; 
            font-family: monospace; 
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: #111d38;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .header {
            margin-bottom: 24px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .status {
            color: #10b981;
        }
        .section-title {
            color: #94a3b8;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .checklist-item {
            border: 1px solid #334155;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .checklist-item label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            flex-grow: 1;
            padding-left: 12px;
            cursor: pointer;
        }
        input[type="checkbox"] {
            width: 32px;
            height: 32px;
            appearance: none;
            background-color: #080d1a;
            border: 1px solid #334155;
            cursor: pointer;
        }
        input[type="checkbox"]:checked {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
        }
        .input-group {
            border: 1px solid #334155;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group label {
            font-weight: bold;
            color: #94a3b8;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #080d1a;
            border: 1px solid #334155;
            color: #f8fafc;
            font-family: monospace;
            font-size: 16px;
            min-height: 64px; /* Fatigue target */
        }
        input[type="number"]:focus {
            outline: 2px solid #0ea5e9;
            outline-offset: -1px;
        }
        button {
            width: 100%;
            min-height: 64px; /* Fatigue target */
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            text-transform: uppercase;
        }
        button:active {
            background-color: #0284c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>DRV-01: PTI</span>
            <span class="status">OFFLINE-SYNC</span>
        </div>
        
        <div class="section-title">PRE-TRIP INSPECTION (VEH-003)</div>
        
        <form onsubmit="event.preventDefault();">
            <div class="checklist-item">
                <input type="checkbox" id="tires" required>
                <label for="tires">TIRES & BRAKES VERIFIED</label>
            </div>
            
            <div class="checklist-item">
                <input type="checkbox" id="oil" required>
                <label for="oil">ENGINE OIL & FLUIDS NORMAL</label>
            </div>
            
            <div class="input-group">
                <label for="temp">REEFER TEMP (TARGET: 0 TO 4C):</label>
                <input type="number" id="temp" placeholder="ENTER CURRENT °C" required>
            </div>
            
            <div class="checklist-item">
                <input type="checkbox" id="seal" required>
                <label for="seal">DOCK SEAL INTEGRITY INTACT</label>
            </div>
            
            <button type="submit">COMPLETE PTI & UNLOCK</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS-01 TERMINAL | Waypoint Dispatch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #080d1a; 
            color: #f8fafc; 
            font-family: monospace; 
            font-size: 14px;
            padding: 24px;
        }
        .header {

            font-size: 16px;

            background-color: #111d38;
            border: 1px solid #1e293b;
            padding: 24px;
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { font-weight: bold; color: #94a3b8; }
        button {
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #0284c7; }
    </style>
</head>
<body>
    <div class="header">
        <div>SYS-01 TERMINAL</div>
        <div style="color: #10b981;">SYS: ONLINE</div>
    </div>
    <div class="content">
        <table>

<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Waypoint System</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "canvas-base": "#050914",
            "primary-blue": "#3b82f6",
            "accent-ice": "#38bdf8",
            "text-primary": "#ffffff",
            "text-secondary": "#94a3b8",
            "text-muted": "#64748b",
            "status-live": "#10b981",
            "status-amber": "#f59e0b",
            "glass-bg": "rgba(255, 255, 255, 0.02)",
            "glass-border": "rgba(255, 255, 255, 0.06)",
            "glass-hover": "rgba(255, 255, 255, 0.04)"
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            body: ["Geist", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .glass-panel {
      background: var(--tw-colors-glass-bg);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--tw-colors-glass-border);
      box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
    }
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 0;
      pointer-events: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-canvas-base text-text-primary font-body antialiased min-h-screen flex flex-col relative overflow-x-hidden selection:bg-primary-blue/30">
  
  <div class="ambient-glow bg-blue-600/10 w-[60vw] h-[60vw] top-[-30%] left-[-20%]"></div>
  <div class="ambient-glow bg-emerald-500/5 w-[50vw] h-[50vw] bottom-[-20%] right-[-10%]"></div>

  <header class="w-full z-50 relative border-b border-white/5">
    <div class="max-w-[1440px] mx-auto px-8 py-5 flex justify-between items-center">
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full bg-status-live shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
          <span class="text-sm font-headline font-semibold tracking-widest uppercase text-white/90">Waypoint Sys</span>
        </div>
        <div class="h-4 w-px bg-white/10"></div>
        <a href="./auth_01.html" class="text-xs font-mono text-text-muted hover:text-white transition-colors flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[16px]">arrow_back</span> Return
        </a>
      </div>
      
      <div class="flex items-center gap-4 text-xs font-mono text-text-secondary">
        <span class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-status-live"></span> Mesh: 99.9%</span>
      </div>
    </div>
  </header>

  <main class="max-w-[1440px] w-full mx-auto px-8 py-10 flex-1 flex flex-col gap-10 z-10 relative">
    
    <div class="flex justify-between items-end">
      <div>
        <h1 class="text-3xl font-headline font-medium text-white/90 tracking-tight">Telemetry</h1>
      </div>
      <div class="glass-panel px-4 py-2 rounded-lg font-mono text-xs flex items-center gap-2 text-text-secondary">
        <span class="material-symbols-outlined text-[16px]">sync</span> Live Sync
      </div>
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <div class="glass-panel p-6 rounded-2xl flex flex-col gap-4">
        <span class="font-mono text-xs text-text-muted">Latency</span>
        <div class="flex items-baseline gap-1">
          <span class="text-4xl font-headline font-medium text-white">14</span>
          <span class="text-sm font-mono text-text-secondary">ms</span>
        </div>
      </div>
      <div class="glass-panel p-6 rounded-2xl flex flex-col gap-4">
        <span class="font-mono text-xs text-text-muted">Active Fleet</span>
        <div class="flex items-baseline gap-1">
          <span class="text-4xl font-headline font-medium text-white">60</span>
          <span class="text-sm font-mono text-text-secondary">/ 60</span>
        </div>
      </div>
      <div class="glass-panel p-6 rounded-2xl flex flex-col gap-4">
        <span class="font-mono text-xs text-text-muted">Cache</span>
        <div class="flex items-baseline gap-1">
          <span class="text-4xl font-headline font-medium text-white">18</span>
          <span class="text-sm font-mono text-text-secondary">mb</span>
        </div>
      </div>
      <div class="glass-panel p-6 rounded-2xl flex flex-col gap-4">
        <span class="font-mono text-xs text-text-muted">Mode</span>
        <div class="flex items-baseline gap-1">
          <span class="text-2xl font-headline font-medium text-accent-ice mt-1">WebSocket</span>
        </div>
      </div>
    </div>

    <!-- Mesh Nodes -->
    <div class="glass-panel rounded-2xl overflow-hidden mt-2">
      <div class="px-6 py-5 border-b border-white/5 flex items-center justify-between">
        <span class="font-mono text-xs text-text-muted uppercase tracking-wider">Edge Nodes</span>
      </div>
      <div class="overflow-x-auto hide-scrollbar">
        <table class="w-full text-left border-collapse min-w-[700px]">
          <tbody class="divide-y divide-white/5 font-mono text-sm">
            <tr class="hover:bg-white/[0.02] transition-colors">
              <td class="py-5 px-6 text-white/90">Peliyagoda Hub</td>
              <td class="py-5 px-6 text-text-secondary">WSS</td>
              <td class="py-5 px-6 text-status-live">12ms</td>
              <td class="py-5 px-6 text-right"><span class="w-2 h-2 rounded-full bg-status-live inline-block"></span></td>
            </tr>
            <tr class="hover:bg-white/[0.02] transition-colors">
              <td class="py-5 px-6 text-white/90">Kandy Bay 02</td>
              <td class="py-5 px-6 text-text-secondary">WSS</td>
              <td class="py-5 px-6 text-status-live">24ms</td>
              <td class="py-5 px-6 text-right"><span class="w-2 h-2 rounded-full bg-status-live inline-block"></span></td>
            </tr>
            <tr class="hover:bg-white/[0.02] transition-colors">
              <td class="py-5 px-6 text-white/90">Van 02 (N.Eliya)</td>
              <td class="py-5 px-6 text-text-secondary">HTTP</td>
              <td class="py-5 px-6 text-status-amber">88ms</td>
              <td class="py-5 px-6 text-right"><span class="w-2 h-2 rounded-full bg-status-amber inline-block"></span></td>
            </tr>
            <tr class="hover:bg-white/[0.02] transition-colors">
              <td class="py-5 px-6 text-white/90">Truck 12 (Kadugannawa)</td>
              <td class="py-5 px-6 text-text-secondary">SMS</td>
              <td class="py-5 px-6 text-text-muted">320ms</td>
              <td class="py-5 px-6 text-right"><span class="w-2 h-2 rounded-full bg-text-muted inline-block"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>

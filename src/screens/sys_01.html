<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--md-sys-color-surface); margin: 0; padding: 24px; }
    
    .error-container { max-width: 480px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    
    .error-icon { width: 120px; height: 120px; border-radius: 60px; background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .error-icon .material-symbols-outlined { font-size: 64px; }
    
    .error-code { font: var(--md-sys-typescale-display-large); color: var(--md-sys-color-on-surface); font-weight: 600; line-height: 1; }
    .error-title { font: var(--md-sys-typescale-headline-small); color: var(--md-sys-color-on-surface); }
    .error-msg { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface-variant); margin-bottom: 16px; }
    
    .action-row { display: flex; gap: 16px; width: 100%; justify-content: center; }
    .action-row .md-filled-button { height: 56px; padding: 0 32px; font: var(--md-sys-typescale-title-medium); }
    
    .tech-details { margin-top: 48px; padding: 16px; background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); font-family: monospace; font-size: 12px; color: var(--md-sys-color-on-surface-variant); text-align: left; width: 100%; }
  </style>
</head>
<body>

  <div class="error-container">
    
    <div class="error-icon">
      <span class="material-symbols-outlined">wifi_off</span>
    </div>
    
    <div>
      <div class="error-code">503</div>
      <div class="error-title">Service Unavailable</div>
    </div>
    
    <div class="error-msg">
      Waypoint Dispatch is currently unable to reach the network. Your local data has been saved and will sync automatically when connection is restored.
    </div>
    
    <div class="action-row">
      <button class="md-filled-button">Return to Dashboard</button>
    </div>
    
    <div class="tech-details">
      ERR_CONNECTION_REFUSED<br>
      Timestamp: 2026-10-06T07:42:15Z<br>
      Client: PWA/1.4.2 (Offline Mode)
    </div>
    
  </div>

</body>
</html>

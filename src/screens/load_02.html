<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Load Inspection — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 820px; margin: 0 auto; background: var(--md-sys-color-surface); }
    .top-bar { height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); }
    .page-title { font: var(--md-sys-typescale-title-large); }
    .v-id { margin-left: auto; font: var(--md-sys-typescale-label-large); color: var(--md-sys-color-on-surface-variant); }

    .page-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    .section-label { font: var(--md-sys-typescale-label-medium); color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }

    .check-card { background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    
    .check-row { display: flex; justify-content: space-between; align-items: center; }
    .check-info { display: flex; flex-direction: column; gap: 4px; }
    .check-title { font: var(--md-sys-typescale-title-medium); color: var(--md-sys-color-on-surface); }
    .check-desc { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }

    /* Pass / Fail Toggle Buttons */
    .toggle-group { display: flex; gap: 8px; background: var(--md-sys-color-surface-container); padding: 4px; border-radius: var(--md-sys-shape-corner-md); }
    .toggle-btn { height: 56px; padding: 0 24px; border: none; border-radius: var(--md-sys-shape-corner-sm); font: var(--md-sys-typescale-title-medium); display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--md-sys-color-on-surface-variant); background: transparent; transition: all var(--md-sys-motion-duration-short); }
    
    .toggle-btn.fail { color: var(--md-sys-color-error); }
    .toggle-btn.fail.active { background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }
    
    .toggle-btn.pass { color: var(--md-sys-color-success); }
    .toggle-btn.pass.active { background: var(--md-sys-color-success); color: #fff; }

    .action-row { padding: 24px; border-top: 1px solid var(--md-sys-color-outline-variant); display: flex; gap: 16px; }
    .action-row .md-filled-button { flex: 1; height: 64px; font: var(--md-sys-typescale-title-medium); }
  </style>
</head>
<body>

  <header class="top-bar">
    <button class="back-btn"><span class="material-symbols-outlined">arrow_back</span></button>
    <div class="page-title">Pre-Load Inspection: Bay 04</div>
    <div class="v-id">VEH-003 · Saman K.</div>
  </header>

  <div class="page-body">
    <div class="section-label">Vehicle Condition Checklist</div>
    
    <div class="check-card">
      <div class="check-row">
        <div class="check-info">
          <div class="check-title">Reefer Temp Pre-cool</div>
          <div class="check-desc">Must be ≤ 4.0°C before loading chilled goods.</div>
        </div>
        <div class="toggle-group">
          <button class="toggle-btn fail"><span class="material-symbols-outlined">close</span> Fail</button>
          <button class="toggle-btn pass active"><span class="material-symbols-outlined">check</span> Pass</button>
        </div>
      </div>
    </div>

    <div class="check-card">
      <div class="check-row">
        <div class="check-info">
          <div class="check-title">Cargo Box Cleanliness</div>
          <div class="check-desc">No debris, odors, or spills from previous run.</div>
        </div>
        <div class="toggle-group">
          <button class="toggle-btn fail"><span class="material-symbols-outlined">close</span> Fail</button>
          <button class="toggle-btn pass active"><span class="material-symbols-outlined">check</span> Pass</button>
        </div>
      </div>
    </div>
    
    <div class="check-card">
      <div class="check-row">
        <div class="check-info">
          <div class="check-title">Tires & Mechanical</div>
          <div class="check-desc">Visual inspection of tires, leaks, and lights.</div>
        </div>
        <div class="toggle-group">
          <button class="toggle-btn fail"><span class="material-symbols-outlined">close</span> Fail</button>
          <button class="toggle-btn pass"><span class="material-symbols-outlined">check</span> Pass</button>
        </div>
      </div>
    </div>

  </div>

  <div class="action-row">
    <button class="md-filled-button" disabled>Clear for Loading</button>
  </div>
  
  <script>
    // Simple toggle logic for demo
    document.querySelectorAll('.toggle-group').forEach(group => {
      const btns = group.querySelectorAll('.toggle-btn');
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          checkAllPassed();
        });
      });
    });

    function checkAllPassed() {
      const allPassed = Array.from(document.querySelectorAll('.toggle-group')).every(group => {
        return group.querySelector('.pass.active') !== null;
      });
      document.querySelector('.md-filled-button').disabled = !allPassed;
    }
  </script>
</body>
</html>

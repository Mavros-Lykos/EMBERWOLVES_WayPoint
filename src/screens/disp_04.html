<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deferral Governance — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: rgba(0,0,0,0.5); padding: 24px; }
    
    .modal-surface { width: 100%; max-width: 560px; background: var(--md-sys-color-surface-container-lowest); border-radius: var(--md-sys-shape-corner-xl); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--md-sys-elevation-3); }
    
    .modal-header { padding: 24px 24px 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font: var(--md-sys-typescale-headline-medium); }
    .close-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); }
    .close-btn:hover { background: var(--md-sys-color-surface-container); }
    
    .modal-body { padding: 24px; overflow-y: auto; max-height: 70vh; display: flex; flex-direction: column; gap: 24px; }
    
    .audit-card { background: var(--md-sys-color-surface-container-low); border-radius: var(--md-sys-shape-corner-md); padding: 16px; display: flex; align-items: center; gap: 16px; border-left: 4px solid var(--md-sys-color-warning); }
    .audit-icon { color: var(--md-sys-color-warning); }
    .audit-text { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface); }
    .audit-text strong { font-weight: 500; }
    
    .section-label { font: var(--md-sys-typescale-label-medium); color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-sm); cursor: pointer; transition: background var(--md-sys-motion-duration-short); }
    .radio-item:hover { background: var(--md-sys-color-surface-container-low); }
    .radio-item.selected { border-color: var(--md-sys-color-primary); background: var(--md-sys-color-primary-container); }
    .radio-item input[type="radio"] { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--md-sys-color-primary); flex-shrink: 0; }
    .radio-content { display: flex; flex-direction: column; gap: 2px; }
    .radio-label { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); cursor: pointer; }
    .radio-desc { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }
    
    .textarea-field { width: 100%; border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-sm); padding: 12px; font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface); resize: vertical; min-height: 80px; background: transparent; }
    .textarea-field:focus { outline: none; border-color: var(--md-sys-color-primary); border-width: 2px; padding: 11px; }
    
    .modal-footer { padding: 16px 24px 24px; border-top: 1px solid var(--md-sys-color-outline-variant); display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  
  <div class="modal-surface" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header">
      <h2 id="modal-title" class="modal-title">Defer Order: ORD-8902</h2>
      <button class="close-btn" aria-label="Close" onclick="location.href='disp_02.html'"><span class="material-symbols-outlined">close</span></button>
    </header>
    
    <div class="modal-body">
      
      <div class="audit-card">
        <span class="material-symbols-outlined audit-icon">history</span>
        <div class="audit-text">
          <strong>Warning: Consecutive Deferral</strong><br>
          This outlet (OUT-021) was deferred yesterday. Further deferral may breach SLA.
        </div>
      </div>
      
      <div>
        <div class="section-label">Reason Taxonomy</div>
        <div class="radio-group">
          <label class="radio-item selected">
            <input type="radio" name="reason" checked>
            <div class="radio-content">
              <span class="radio-label">Volume limit exceeded</span>
              <span class="radio-desc">Order m³ exceeds remaining fleet capacity.</span>
            </div>
          </label>
          <label class="radio-item">
            <input type="radio" name="reason">
            <div class="radio-content">
              <span class="radio-label">No reefer capacity</span>
              <span class="radio-desc">Chilled goods with no compatible vehicles available.</span>
            </div>
          </label>
          <label class="radio-item">
            <input type="radio" name="reason">
            <div class="radio-content">
              <span class="radio-label">Time budget exceeded</span>
              <span class="radio-desc">Delivery cannot complete within the 270m/480m limits.</span>
            </div>
          </label>
        </div>
      </div>
      
      <div>
        <div class="section-label">Business Justification (Optional)</div>
        <textarea class="textarea-field" placeholder="Add specific context for this deferral..."></textarea>
      </div>
      
    </div>
    
    <footer class="modal-footer">
      <button class="md-text-button" onclick="location.href='disp_02.html'">Cancel</button>
      <button class="md-filled-button" onclick="location.href='disp_02.html'">Confirm Deferral</button>
    </footer>
  </div>
  
</body>
</html>

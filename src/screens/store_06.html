<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Issue — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 640px; margin: 0 auto; }
    .top-bar { height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .back-btn { background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant); display: flex; align-items: center; padding: 8px; border-radius: var(--md-sys-shape-corner-full); }
    .top-bar .page-title { font: var(--md-sys-typescale-title-large); }
    .page-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
    .section-label { font: var(--md-sys-typescale-label-medium); color: var(--md-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }

    .radio-group { display: flex; flex-direction: column; gap: 4px; }
    .radio-item { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 12px 16px; border-radius: var(--md-sys-shape-corner-sm); cursor: pointer; transition: background var(--md-sys-motion-duration-short); }
    .radio-item:hover { background: var(--md-sys-color-surface-container-low); }
    .radio-item input[type="radio"] { width: 20px; height: 20px; accent-color: var(--md-sys-color-primary); flex-shrink: 0; }
    .radio-item label { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface); cursor: pointer; }

    .affected-card { background: var(--md-sys-color-surface-container-lowest); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); padding: 16px; }
    .sku-row { display: flex; justify-content: space-between; align-items: center; }
    .sku-name { font: var(--md-sys-typescale-body-large); }
    .sku-detail { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }

    .photo-upload { display: flex; align-items: center; justify-content: center; gap: 8px; height: 120px; border: 2px dashed var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-md); color: var(--md-sys-color-on-surface-variant); font: var(--md-sys-typescale-body-medium); cursor: pointer; transition: border-color var(--md-sys-motion-duration-short); }
    .photo-upload:hover { border-color: var(--md-sys-color-primary); color: var(--md-sys-color-primary); }

    .bottom-action { padding: 16px 24px; border-top: 1px solid var(--md-sys-color-outline-variant); }
    .bottom-action .md-filled-button { width: 100%; height: 48px; }
  </style>
</head>
<body>
  <header class="top-bar">
    <button class="back-btn" aria-label="Back" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
    <span class="page-title">Report issue</span>
  </header>
  <div class="page-body">
    <div>
      <div class="section-label">Issue type</div>
      <div class="radio-group">
        <div class="radio-item"><input type="radio" name="type" id="t1" checked><label for="t1">Crates short</label></div>
        <div class="radio-item"><input type="radio" name="type" id="t2"><label for="t2">Damaged goods</label></div>
        <div class="radio-item"><input type="radio" name="type" id="t3"><label for="t3">Wrong items</label></div>
        <div class="radio-item"><input type="radio" name="type" id="t4"><label for="t4">Temperature breach</label></div>
      </div>
    </div>

    <div>
      <div class="section-label">Affected item</div>
      <div class="affected-card">
        <div class="sku-row">
          <div>
            <div class="sku-name">Yoghurt 80g</div>
            <div class="sku-detail">SKU-402 · Pallet #P-104</div>
          </div>
          <span class="md-badge warning"><span class="material-symbols-outlined" style="font-size:14px">warning</span> 2 short</span>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Photo evidence</div>
      <div class="photo-upload" role="button" tabindex="0" aria-label="Upload photo" onclick="this.innerHTML='<span class=\'material-symbols-outlined\' style=\'color:var(--md-sys-color-success)\'>check_circle</span> Photo attached (crate_shortage_dock.jpg)'; this.style.borderColor='var(--md-sys-color-success)';">
        <span class="material-symbols-outlined">photo_camera</span>
        Take or upload photo
      </div>
    </div>
  </div>
  <div class="bottom-action">
    <button class="md-filled-button" onclick="location.href='store_01.html'">Submit report</button>
  </div>
</body>
</html>

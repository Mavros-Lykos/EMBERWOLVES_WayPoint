<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rest Period — Waypoint</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="../styles/material-tokens.css">
  <style>
    html { font-size: 16px; }
    body { display: flex; flex-direction: column; min-height: 100vh; max-width: 420px; margin: 0 auto; background: var(--md-sys-color-surface); }
    
    .mobile-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .title { font: var(--md-sys-typescale-title-large); }
    
    .page-body { flex: 1; overflow-y: auto; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

    .timer-circle { width: 240px; height: 240px; border-radius: 120px; border: 8px solid var(--md-sys-color-surface-container-highest); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 32px; }
    /* Fake progress using borders */
    .timer-circle::after { content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px; border-radius: 120px; border: 8px solid var(--md-sys-color-primary); clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 0 100%, 0 50%); }
    
    .time-val { font: var(--md-sys-typescale-display-large); font-weight: 700; color: var(--md-sys-color-on-surface); line-height: 1; }
    .time-label { font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface-variant); margin-top: 8px; }

    .info-card { background: var(--md-sys-color-surface-container-low); padding: 16px; border-radius: var(--md-sys-shape-corner-md); display: flex; align-items: flex-start; gap: 12px; text-align: left; margin-bottom: 24px; width: 100%; }
    .info-card .material-symbols-outlined { color: var(--md-sys-color-primary); }
    .info-text { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface); }
    
    .penalty-warn { display: flex; align-items: center; gap: 8px; font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-error); }

    .bottom-action { padding: 16px; border-top: 1px solid var(--md-sys-color-outline-variant); }
    .bottom-action .md-outlined-button { width: 100%; height: 64px; font: var(--md-sys-typescale-title-medium); color: var(--md-sys-color-error); border-color: var(--md-sys-color-error); }
  </style>
</head>
<body>

  <header class="mobile-top-bar">
    <span class="title">Mandatory Rest</span>
  </header>

  <div class="page-body">
    
    <div class="timer-circle">
      <div class="time-val">12:45</div>
      <div class="time-label">Remaining</div>
    </div>
    
    <div class="info-card">
      <span class="material-symbols-outlined">shield_moon</span>
      <div class="info-text">You have reached the 4-hour continuous driving limit. Vehicle tracking is paused.</div>
    </div>
    
    <div class="penalty-warn">
      <span class="material-symbols-outlined" style="font-size:20px">warning</span>
      Skipping rest incurs a safety penalty.
    </div>

  </div>

  <div class="bottom-action">
    <button class="md-outlined-button">End Rest Early (Penalty)</button>
  </div>

</body>
</html>
